<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knowledge</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#">Knowledge</a>
    </header>
    <main>
      <section id="list-view" aria-labelledby="list-title">
        <h1 id="list-title" tabindex="-1">知識ノート</h1>
        <p id="list-status" role="status">記事一覧を読み込んでいます…</p>
        <ul id="articles" class="articles"></ul>
      </section>
      <section id="article-view" aria-labelledby="article-title" hidden>
        <a class="back-link" href="#">← 一覧に戻る</a>
        <article>
          <h1 id="article-title" tabindex="-1"></h1>
          <p id="article-subtitle" class="subtitle"></p>
          <div id="article-status" role="status"></div>
          <div id="article-body" class="markdown"></div>
        </article>
      </section>
    </main>
    <noscript>記事を表示するにはJavaScriptを有効にしてください。</noscript>
  </body>
</html>
